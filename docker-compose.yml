services:
  api:
    build: .
    ports:
      - "8080:8080"
    command: bash -c "uvicorn app.app:app
      --host 0.0.0.0 --port 8080
      --lifespan=on --use-colors --loop uvloop --http httptools
      --reload --log-level debug
      "
    volumes:
      - ./app.py:/faust/app/app.py
      - ./worker-data:/worker-data
    environment:
      FAUST_BROKER_URL: "aiokafka://kafka:29092"
      APP_DATADIR: "/worker-data"
      APP_TABLEDIR: "/worker-data"
    depends_on:
      kafka:
        condition: service_healthy

  worker:
    build: .
    command: bash -c "python -m app.worker worker -l info "
    volumes:
      - ./worker.py:/faust/app/worker.py
      - ./worker-data:/worker-data
    environment:
      FAUST_BROKER_URL: "aiokafka://kafka:29092"
      APP_DATADIR: "/worker-data"
      APP_TABLEDIR: "/worker-data"
    depends_on:
      api:
        condition: service_started
      kafka:
        condition: service_healthy

  kafka:
    image: confluentinc/cp-kafka:7.5.3
    ports:
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:32181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
      - kafka-secrets:/etc/kafka/secrets
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 29092 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    ports:
      - "32181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 32181
      ZOOKEEPER_LOG4J_ROOT_LOGLEVEL: WARN
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
      - zookeeper-secrets:/etc/zookeeper/secrets
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 32181 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  kafka-data: { }
  kafka-secrets: { }
  zookeeper-data: { }
  zookeeper-log: { }
  zookeeper-secrets: { }
